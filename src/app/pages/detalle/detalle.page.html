<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="ion-text-center" *ngIf="cargando">
    <ion-spinner></ion-spinner>
  </div>

  <div *ngIf="!cargando && disco">
    <h1>{{ disco.titulo }}</h1>
    <h3>{{ disco.artista }}</h3>

    <ion-list lines="none">

      <ion-item *ngIf="disco.anio">
        <ion-label>
          <p>Año</p>
          <h2>{{ disco.anio }}</h2>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-label>
          <p>Código de barras</p>
          <h2>{{ disco.codigoBarras }}</h2>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-label>
          <p>Agregado el</p>
          <h2>{{ disco.fechaAlta | date:'dd/MM/yyyy' }}</h2>
        </ion-label>
      </ion-item>
      
    </ion-list>

    <ion-button expand="block" color="danger" class="ion-margin-top" (click)="confirmarEliminar()">
      <ion-icon slot="start" name="trash-outline"></ion-icon>
      Eliminar de mi colección
    </ion-button>
  </div>

  <div class="ion-text-center" *ngIf="!cargando && noEncontrado">
    <p>No encontramos este disco en tu colección.</p>
    <ion-button fill="outline" routerLink="/home">Volver</ion-button>
  </div>
</ion-content>
